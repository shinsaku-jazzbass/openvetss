<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ボタンカルテ v0.1</title>
<style>
:root{
  --paper:#FBF9F4; --paper2:#F2EFE8; --rule:#D8D2C6; --rule2:#EAE5DA;
  --ink:#1F2A2E; --ink2:#5A6A70; --ink3:#8C8578;
  --blue:#42606E; --blue-lo:#EAF0F1;
  --seal:#2F7A5C; --seal-lo:#E7F1EC;
  --S:#3D6B8A; --O:#2F7A5C; --A:#9A5B2E; --P:#6B4C8A;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%}
body{font-family:var(--gothic);background:var(--paper2);color:var(--ink);
  overflow:hidden;-webkit-text-size-adjust:100%;line-height:1.7}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:1px}

.app{height:100dvh;height:100vh;display:grid;grid-template-rows:auto auto 1fr;gap:8px;padding:8px}

/* ── 上部 ── */
.hd{background:var(--paper);border-radius:6px;border:1px solid var(--rule);
  padding:9px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd h1{font-family:var(--mincho);font-size:15px;letter-spacing:.14em;font-weight:600}
.hd .pt{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.hd .pt b{color:var(--ink)}
.hd .sp{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.bar{background:var(--paper);border:1px solid var(--rule);border-radius:6px;
  padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .lb{font-size:11px;letter-spacing:.08em;color:var(--ink3);margin-right:2px}
.bar .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.bar .chip{padding:9px 18px;font-size:13.5px}
.bar .chip.go{font-size:14px;padding:10px 22px}
.chip{font-size:12px;color:var(--ink2);border:1px solid var(--rule);border-radius:14px;
  padding:5px 13px;background:var(--paper);white-space:nowrap}
.chip:active{background:var(--paper2)}
.chip.go{background:var(--seal);border-color:var(--seal);color:#fff}
.vt{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink3)}
.vt input{width:4.6em;padding:5px 7px;border:1px solid var(--rule);border-radius:4px;
  background:#fff;font-family:var(--mono);font-size:14px;text-align:right}

/* ── 本体 ── */
.deck{display:grid;grid-template-columns:minmax(300px,37%) 1fr;gap:8px;min-height:0}

/* カルテ用紙 */
.karte{background:var(--paper);border:1px solid var(--rule);border-radius:6px;
  display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.sec{border-bottom:1px solid var(--rule2);padding:9px 12px 11px}
.sec:last-child{border-bottom:0}
.sec.on{background:#FFFDF5}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.sec-hd .tag{font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;
  width:1.55em;height:1.55em;border-radius:3px;display:grid;place-content:center}
.sec-S .tag{background:var(--S)} .sec-O .tag{background:var(--O)}
.sec-A .tag{background:var(--A)} .sec-P .tag{background:var(--P)}
.sec-hd .nm{font-family:var(--mincho);font-size:14px;font-weight:600}
.sec-hd .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.sec textarea{width:100%;min-height:4.6em;border:1px solid transparent;border-radius:4px;
  background:transparent;font-size:14.5px;line-height:1.8;resize:vertical;padding:4px 5px}
.sec.on textarea{background:#fff;border-color:var(--rule)}
.sec .picks{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sec .picks span{font-size:10.5px;color:var(--ink3);background:var(--paper2);
  border-radius:3px;padding:1px 6px}

/* 文例パネル */
.pane{display:grid;grid-template-rows:auto auto 1fr;gap:7px;min-height:0}
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tab{font-size:12.5px;padding:7px 14px;border-radius:15px;border:1px solid var(--rule);
  background:var(--paper);color:var(--ink2);white-space:nowrap;flex:none}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.srch{display:flex;align-items:center;gap:9px;background:var(--paper);
  border:1px solid var(--rule);border-radius:6px;padding:6px 12px}
.srch input{flex:1;border:0;background:transparent;font-size:15px;outline:none;min-width:0}
.srch .n{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}
.keys{background:var(--paper);border:1px solid var(--rule);border-radius:6px;
  padding:7px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;align-content:start}
.key{background:#fff;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;
  padding:9px 10px;font-size:13.5px;text-align:left;line-height:1.35;min-height:42px;
  display:flex;flex-direction:column;justify-content:center}
.key:active{background:var(--seal-lo);border-color:var(--seal);transform:translateY(1px)}
.key em{font-style:normal;font-size:10px;color:var(--ink3);margin-top:2px;font-family:var(--mono)}
.key .g{font-style:normal;font-size:9.5px;color:var(--blue);margin-bottom:2px}
.key.hot{background:var(--seal-lo);border-color:#B9D6C8}
.empty{padding:34px 12px;text-align:center;color:var(--ink3);font-size:13px;
  grid-column:1/-1;line-height:1.9}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);
  color:var(--paper);padding:9px 20px;border-radius:20px;font-size:13px;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:50;max-width:92vw;text-align:center}
.toast.on{opacity:1}

/* 出力 */
.sheet{position:fixed;inset:0;background:rgba(31,42,46,.86);display:none;
  align-items:center;justify-content:center;padding:16px;z-index:40}
.sheet.on{display:flex}
.card{background:var(--paper);border-radius:8px;width:min(760px,100%);max-height:92dvh;
  display:flex;flex-direction:column;overflow:hidden}
.card h2{font-family:var(--mincho);font-size:16px;letter-spacing:.1em;padding:18px 24px 4px}
.card .lead{font-size:12.5px;color:var(--ink2);padding:0 24px 12px}
.card pre{margin:0 24px;background:#fff;border:1px solid var(--rule);border-radius:5px;
  padding:14px;font-family:var(--mono);font-size:11.5px;line-height:1.7;overflow:auto;flex:1}
.card .act{display:flex;gap:8px;padding:14px 24px 18px;flex-wrap:wrap}
.card .act .chip{padding:11px 20px;font-size:14px}

@media (max-width:860px){
  .deck{grid-template-columns:1fr;grid-template-rows:minmax(150px,1.1fr) 1.4fr}
  .keys{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="hd">
    <h1>ボタンカルテ</h1>
    <span class="pt">診察券 <b id="ptId">—</b> <span id="ptNm"></span></span>
    <span class="vt">体重 <input id="vW" inputmode="decimal" placeholder="kg"></span>
    <span class="vt">体温 <input id="vT" inputmode="decimal" placeholder="℃"></span>
  </div>

  <div class="bar">
    <span class="lb">操作</span>
    <button class="chip" id="bUndo">1つ戻す</button>
    <button class="chip" id="bClear">全消去</button>
    <span class="sp">
      <button class="chip" id="bHub" hidden>ハブへ戻る</button>
      <button class="chip go" id="bOut">記録を書き出す</button>
    </span>
  </div>

  <div class="deck">
    <div class="karte" id="karte"></div>

    <div class="pane">
      <div class="tabs" id="tabs"></div>
      <div class="srch">
        <input id="q" type="search" placeholder="文例を探す（部分一致）" autocomplete="off">
        <span class="n" id="qn"></span>
      </div>
      <div class="keys" id="keys"></div>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="card">
    <h2>記 録</h2>
    <p class="lead">カルテ本文に加えて、押した文例の番号（picks）も残ります。文字列だけでは後から集計できませんが、番号があれば「どの症状が何件あったか」を数えられます。</p>
    <pre id="out"></pre>
    <div class="act">
      <button class="chip" id="bBack">閉じる</button>
      <button class="chip" id="bCopy">本文をコピー</button>
      <button class="chip go" id="bSave">ファイルに保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const MASTER_URL = "./karte_master.json";
const ORDER = ["S","O","A","P"];
const LABEL = { S:"主訴", O:"所見", A:"診断", P:"方針" };

let M = null;                 /* マスタ */
let GROUPS = [];
let cur = { soap:"S", group:null };
const K = { S:{text:"",picks:[]}, O:{text:"",picks:[]},
            A:{text:"",picks:[]}, P:{text:"",picks:[]} };
const HIST = [];              /* 戻す用 */
const FREQ = Object.create(null);

/* ══ 受診ハブとの共有（同じドメインの端末内ストレージ）══════
   ?visit=キー を付けて開かれたときだけ、記録をハブへ書き戻します。
   単独で使うときは何も起きません。 */
const VISIT = new URLSearchParams(location.search).get("visit") || "";
const HUB = { h:null, ok:false };
function hubOpen(){
  return new Promise(res=>{
    if(!VISIT) return res(null);
    let q; try{ q = indexedDB.open("vetss",1); }catch(e){ return res(null); }
    q.onupgradeneeded = e=>{ const d=e.target.result;
      if(!d.objectStoreNames.contains("visits")) d.createObjectStore("visits",{keyPath:"key"}); };
    q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); q.onblocked=()=>res(null);
    setTimeout(()=>res(null),3000);
  });
}
/* ハブに記録済みの内容を読み戻します（再編集のため）。
   これが無いと、開いた直後に何か触った時点で空の内容で上書きされます。 */
function hubLoad(){
  return new Promise(res=>{
    if(!HUB.ok) return res(false);
    let done=false; const fin=v=>{ if(!done){done=true;res(v);} };
    setTimeout(()=>fin(false), 2500);
    try{
      const st = HUB.h.transaction("visits","readonly").objectStore("visits");
      const g = st.get(VISIT);
      g.onsuccess = ()=>{
        const v = g.result;
        if(!v || !v.karte) return fin(false);
        const s = v.karte.soap || {};
        let any = false;
        for(const x of ORDER){
          if(s[x]){
            K[x].text  = s[x].text || "";
            K[x].picks = (s[x].picks || []).map(id=>({ id:id, t:"" }));
            if(K[x].text || K[x].picks.length) any = true;
          }
        }
        const vt = v.karte.vitals || {};
        if(vt.weight != null) $("vW").value = vt.weight;
        if(vt.temp   != null) $("vT").value = vt.temp;
        fin(any);
      };
      g.onerror = ()=>fin(false);
    }catch(e){ fin(false); }
  });
}

let hubT, hubFail = false;
function hubSave(){
  if(!HUB.ok) return;
  clearTimeout(hubT);
  hubT = setTimeout(()=>{
    try{
      const st = HUB.h.transaction("visits","readwrite").objectStore("visits");
      const g = st.get(VISIT);
      g.onsuccess = ()=>{
        let v = g.result;
        if(!v){
          /* ハブのレコードが見つからないときは、この場で作ります */
          const q = new URLSearchParams(location.search);
          /* 受診キーは「診察券ID_日付」なので、キーから日付を取り出します。
             日付をまたいでも同じ受診に書き足せるようにするためです。 */
          const m = String(VISIT).match(/_(\d{4}-\d{2}-\d{2})$/);
          const d = new Date();
          const pad2 = n => String(n).padStart(2,"0");
          v = { key:VISIT, karteId:q.get("karteId")||"", alias:q.get("alias")||"",
                date: m ? m[1]
                        : d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()),
                enquete:null, karte:null, receipt:null };
        }
        v.karte = build();
        v.updatedAt = isoLocal(new Date());
        const w = st.put(v);
        w.onerror = ()=>{ if(!hubFail){ hubFail=true; toast("ハブへ記録できませんでした"); } };
      };
      g.onerror = ()=>{ if(!hubFail){ hubFail=true; toast("ハブへ記録できませんでした"); } };
    }catch(e){ if(!hubFail){ hubFail=true; toast("ハブへ記録できませんでした"); } }
  }, 700);
}

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tT; const toast = m => { const e=$("toast"); e.textContent=m; e.classList.add("on");
  clearTimeout(tT); tT=setTimeout(()=>e.classList.remove("on"),1800); };

/* ── カルテ用紙 ── */
function drawKarte(){
  $("karte").innerHTML = ORDER.map(k=>
    '<div class="sec sec-'+k+(cur.soap===k?" on":"")+'" data-soap="'+k+'">'+
      '<div class="sec-hd"><span class="tag">'+k+'</span>'+
        '<span class="nm">'+LABEL[k]+'</span>'+
        '<span class="ct">'+(K[k].picks.length?K[k].picks.length+" 件":"")+'</span></div>'+
      '<textarea data-soap="'+k+'" rows="3" placeholder="'+
        (cur.soap===k?"文例を押すとここに入ります":"")+'">'+esc(K[k].text)+'</textarea>'+
      (K[k].picks.length
        ? '<div class="picks">'+K[k].picks.map(p=>'<span>'+p.id+'</span>').join("")+'</div>'
        : "")+
    '</div>').join("");
}
$("karte").addEventListener("click", e=>{
  const sec = e.target.closest("[data-soap]");
  if(!sec) return;
  const k = sec.dataset.soap;
  if(cur.soap !== k){
    cur.soap = k;
    cur.group = firstGroupOf(k);
    drawKarte(); drawTabs(); drawKeys();
  }
});
$("karte").addEventListener("input", e=>{
  if(e.target.tagName !== "TEXTAREA") return;
  K[e.target.dataset.soap].text = e.target.value;   /* 手入力も受ける */
  hubSave();
});

/* ── 大分類タブ ── */
const groupsOf = k => GROUPS.filter(g=>g.soap===k);
const firstGroupOf = k => { const g=groupsOf(k); return g.length?g[0].id:null; };
function drawTabs(){
  const gs = groupsOf(cur.soap);
  $("tabs").innerHTML = gs.map(g=>
    '<button class="tab'+(cur.group===g.id?" on":"")+'" data-g="'+g.id+'">'+
    esc(g.n)+'</button>').join("");
}
$("tabs").addEventListener("click", e=>{
  const b = e.target.closest("[data-g]"); if(!b) return;
  cur.group = +b.dataset.g; $("q").value=""; drawTabs(); drawKeys();
});

/* ── 文例キー ── */
function drawKeys(){
  const q = $("q").value.replace(/[\s\u3000]/g,"");
  let list = [];
  if(q){
    for(const g of groupsOf(cur.soap))
      for(const it of g.items)
        if(it.t.replace(/[\s\u3000]/g,"").indexOf(q) >= 0 ||
           (it.s && it.s.indexOf(q) >= 0)) list.push({g, it});
    list = list.slice(0, 300);
  }else{
    const g = GROUPS.find(x=>x.id===cur.group);
    if(g) list = g.items.map(it=>({g, it}));
    /* よく使うものを前へ（この端末で押した回数） */
    list.sort((a,b)=>(FREQ[b.it.id]||0)-(FREQ[a.it.id]||0));
  }
  $("qn").textContent = list.length ? list.length+" 件" : "";
  if(!list.length){
    $("keys").innerHTML = '<div class="empty">該当する文例がありません。<br>'+
      '文例そのものは <b>karte_master.json</b> に入っています。</div>';
    return;
  }
  $("keys").innerHTML = list.map(({g,it})=>
    '<button class="key'+(FREQ[it.id]?" hot":"")+'" data-id="'+it.id+'">'+
      (q ? '<em class="g">'+esc(g.n)+'</em>' : '')+
      esc(it.t)+
      (it.s ? '<em>'+esc(it.s)+'</em>' : '')+
    '</button>').join("");
}
$("q").oninput = drawKeys;
$("keys").addEventListener("click", e=>{
  const b = e.target.closest("[data-id]"); if(!b) return;
  const id = +b.dataset.id;
  let found = null;
  for(const g of GROUPS){ const it = g.items.find(x=>x.id===id); if(it){ found=it; break; } }
  if(!found) return;
  press(found);
});

/* 押す＝現在のSOAP欄に足す（現行 msgadd.php と同じ単純連結） */
function press(it){
  const k = cur.soap;
  K[k].text += it.t;
  K[k].picks.push({ id:it.id, t:it.t });
  HIST.push({ soap:k, len:it.t.length });
  FREQ[it.id] = (FREQ[it.id]||0) + 1;
  drawKarte(); drawKeys(); hubSave();
}
$("bUndo").onclick = ()=>{
  const h = HIST.pop();
  if(!h){ toast("戻すものがありません"); return; }
  K[h.soap].text = K[h.soap].text.slice(0, -h.len);
  K[h.soap].picks.pop();
  drawKarte(); hubSave();
};
$("bClear").onclick = ()=>{
  if(!confirm("4つの欄をすべて消します。よろしいですか？")) return;
  for(const k of ORDER){ K[k].text=""; K[k].picks=[]; }
  HIST.length = 0; $("vW").value=""; $("vT").value="";
  drawKarte(); hubSave();
};

/* ── 書き出し ── */
function build(){
  const q = new URLSearchParams(location.search);
  const o = {
    schema:"vetss-karte/0.1",
    recordedAt: isoLocal(new Date()),
    patient:{ karteId:q.get("karteId")||"", alias:q.get("alias")||"", resolved:false },
    vitals:{},
    soap:{}
  };
  const w = parseFloat($("vW").value), t = parseFloat($("vT").value);
  if(!isNaN(w)) o.vitals.weight = w;
  if(!isNaN(t)) o.vitals.temp   = t;
  for(const k of ORDER)
    o.soap[k] = { text:K[k].text, picks:K[k].picks.map(p=>p.id) };
  return o;
}
const pad = n => String(n).padStart(2,"0");
function isoLocal(d){
  const off=-d.getTimezoneOffset(), s=off>=0?"+":"-", a=Math.abs(off);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+
    pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+
    s+pad(Math.floor(a/60))+":"+pad(a%60);
}
let CUR = null;
$("bOut").onclick = ()=>{
  if(!ORDER.some(k=>K[k].text)){ toast("まだ何も入力されていません"); return; }
  CUR = build();
  $("out").textContent = JSON.stringify(CUR, null, 2);
  $("sheet").classList.add("on");
};
$("bBack").onclick = ()=> $("sheet").classList.remove("on");
$("bCopy").onclick = async ()=>{
  const txt = ORDER.filter(k=>K[k].text)
    .map(k=>"【"+LABEL[k]+"】\n"+K[k].text).join("\n\n");
  try{ await navigator.clipboard.writeText(txt); toast("本文をコピーしました"); }
  catch(e){ toast("コピーできませんでした"); }
};
$("vW").oninput = hubSave;
$("vT").oninput = hubSave;
$("bHub").onclick = ()=>{ location.href = "../visit/visit.html?visit=" + encodeURIComponent(VISIT); };
$("bSave").onclick = ()=>{
  const b = new Blob([JSON.stringify(CUR,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "karte_" + CUR.recordedAt.slice(0,10).replace(/-/g,"") + ".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("保存しました");
};
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") $("sheet").classList.remove("on");
});

/* ── 起動 ── */
async function boot(){
  if(VISIT){
    HUB.h = await hubOpen(); HUB.ok = !!HUB.h;
    $("bHub").hidden = false;
  }
  const q = new URLSearchParams(location.search);
  $("ptId").textContent = q.get("karteId") || "—";
  $("ptNm").textContent = q.get("alias") ? q.get("alias")+" 様" : "";

  try{
    const res = await fetch(MASTER_URL, {cache:"no-cache"});
    if(!res.ok) throw new Error(res.status);
    M = await res.json();
  }catch(err){
    $("keys").innerHTML =
      '<div class="empty">文例マスタ（karte_master.json）を読み込めませんでした。<br>'+
      'このファイルと同じ場所に置いてください。<br><br>'+
      '<label class="chip" style="display:inline-block">'+
      'マスタを選ぶ<input type="file" id="pick" accept=".json" hidden></label></div>';
    const p = $("pick");
    if(p) p.onchange = async e=>{
      try{ M = JSON.parse(await e.target.files[0].text()); start(); }
      catch(x){ toast("このファイルは読み込めませんでした"); }
    };
    return;
  }
  start();
}
async function start(){
  GROUPS = M.groups || [];
  cur.soap = "S"; cur.group = firstGroupOf("S");
  const restored = await hubLoad();
  drawKarte(); drawTabs(); drawKeys();
  if(restored) toast("前回の記載を読み込みました。続けて書けます");
}
boot();
</script>
