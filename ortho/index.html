<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>整形外科学的検査カルテ — デジタル問診ツール</title>
<style>
  :root{
    --ink:#22333B;        /* 深い青灰(診察室の落ち着き) */
    --paper:#F5F6F4;      /* 冷たすぎない診療紙 */
    --card:#FFFFFF;
    --line:#D8DCD9;
    --accent:#0E7C66;     /* 検査済みの緑(カルテの検印色) */
    --accent-soft:#E3F1ED;
    --right:#B65C2E;      /* 右=暖 */
    --left:#3D6B9E;       /* 左=寒 */
    --muted:#7A8580;
    --danger:#A64B3C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    font-size:16px; line-height:1.55;}
  header.app{
    background:var(--ink); color:#F2F4F1; padding:14px 18px 12px;
    position:sticky; top:0; z-index:30; box-shadow:0 2px 8px rgba(0,0,0,.18);}
  header.app h1{
    margin:0; font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:1.25rem; font-weight:600; letter-spacing:.06em;}
  header.app .src{font-size:.72rem; opacity:.75; letter-spacing:.04em; margin-top:2px;}
  header.app .loadrow{margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .btn{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:8px; padding:8px 14px; font-size:.9rem; cursor:pointer;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .btn.ghost{background:transparent; color:#F2F4F1; border-color:#5b6a66;}
  .banner{
    background:#FBF3E2; border:1px solid #E4D2A8; color:#6b5518;
    padding:8px 12px; font-size:.85rem; border-radius:8px; margin:12px 16px 0;}
  /* ページ・ステッパー(検査手順=実際の順序を持つ) */
  nav.steps{
    display:flex; gap:6px; overflow-x:auto; padding:10px 16px; position:sticky;
    top:64px; background:var(--paper); z-index:20; border-bottom:1px solid var(--line);}
  nav.steps button{
    flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:999px; padding:6px 14px; font-size:.85rem; cursor:pointer; white-space:nowrap;}
  nav.steps button.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  nav.steps button .n{
    display:inline-block; font-size:.7rem; opacity:.65; margin-right:5px;}
  main{max-width:860px; margin:0 auto; padding:8px 16px 120px;}
  section.group{background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin:14px 0; overflow:hidden;}
  section.group > h2{
    margin:0; padding:10px 16px; font-size:.95rem; letter-spacing:.05em;
    background:linear-gradient(0deg,#fff, #FAFBFA); border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:10px;}
  section.group > h2 .pg{font-size:.7rem; color:var(--muted); font-weight:400;}
  .q{padding:12px 16px; border-bottom:1px dashed #E7EAE7;}
  .q:last-child{border-bottom:none;}
  .q.answered{background:var(--accent-soft);}
  .q .label{font-size:.95rem; margin-bottom:8px; font-weight:600; display:flex; gap:8px; align-items:baseline;}
  .q .label .req{color:var(--danger); font-size:.72rem; font-weight:400;}
  .q .label .done{color:var(--accent); font-size:.8rem; font-weight:400; margin-left:auto;}
  .opts{display:flex; flex-wrap:wrap; gap:8px;}
  .opt{
    border:1px solid var(--line); background:#fff; border-radius:8px;
    padding:9px 14px; font-size:.92rem; cursor:pointer; user-select:none;}
  .opt.sel{background:var(--ink); color:#fff; border-color:var(--ink);}
  .opt.sel.side-r{background:var(--right); border-color:var(--right);}
  .opt.sel.side-l{background:var(--left); border-color:var(--left);}
  input.free{margin-top:8px; width:100%;}
  input[type=text], input[type=number], input[type=date]{
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:1rem;
    background:#fff; color:var(--ink); width:100%; max-width:340px;}
  .numrow{display:flex; align-items:center; gap:8px;}
  .numrow .unit{color:var(--muted); font-size:.9rem;}
  /* 左右(lr): 整形外科の本質=左右比較。対の帯で示す */
  .lr{display:grid; grid-template-columns:2.6em 1fr; gap:8px 10px; align-items:center;}
  .lr .side{font-weight:700; font-size:.85rem; text-align:center; border-radius:6px; padding:6px 0; color:#fff;}
  .lr .side.r{background:var(--right);}
  .lr .side.l{background:var(--left);}
  .lr .side.b{background:#6C7A75;}
  .scale{max-width:420px;}
  .scale .val{font-size:1.4rem; font-weight:700; min-width:2.2em; display:inline-block;}
  .scale .val.na{color:var(--muted); font-size:.9rem; font-weight:400;}
  input[type=range]{width:100%;}
  /* 下部バー */
  footer.bar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:rgba(34,51,59,.97); color:#fff; padding:10px 16px;
    display:flex; gap:12px; align-items:center;}
  footer.bar .prog{font-size:.85rem; opacity:.85;}
  footer.bar .sp{flex:1;}
  /* 出力パネル(カルテ貼付票) */
  #outWrap{display:none; position:fixed; inset:0; background:rgba(20,28,32,.55); z-index:50;
    padding:20px; overflow:auto;}
  #outCard{
    background:#FFFDF7; max-width:720px; margin:0 auto; border-radius:10px;
    border:1px solid #CFC9B8; box-shadow:0 12px 40px rgba(0,0,0,.35); overflow:hidden;}
  #outCard .head{padding:12px 18px; border-bottom:1px solid #E4DFCE; display:flex; gap:10px; align-items:center;}
  #outCard .head h3{margin:0; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:1.02rem;}
  #outCard .head .sp{flex:1;}
  #outText{
    white-space:pre-wrap; font-family:"Hiragino Kaku Gothic ProN",monospace;
    font-size:.92rem; padding:16px 18px; margin:0; max-height:60vh; overflow:auto;}
  #outCard .foot{padding:12px 18px; border-top:1px solid #E4DFCE; display:flex; gap:10px; flex-wrap:wrap;}
  .toast{
    position:fixed; bottom:86px; left:50%; transform:translateX(-50%);
    background:var(--accent); color:#fff; padding:8px 18px; border-radius:999px;
    font-size:.9rem; z-index:60; opacity:0; transition:opacity .25s;}
  .toast.show{opacity:1;}
  @media (max-width:560px){
    main{padding:8px 10px 120px;}
    .q{padding:12px;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header class="app">
  <h1 id="ttl">整形外科学的検査カルテ</h1>
  <div class="src" id="src">日本獣医麻酔外科学会 整形外科委員会 ver.1 準拠 ／ 端末外へデータを送信・保存しません</div>
  <div class="src" id="metaLine" style="display:none; color:#CFE8DF; font-size:.82rem; margin-top:4px;"></div>
  <div class="loadrow">
    <!-- <button class="btn ghost" onclick="document.getElementById('jsonFile').click()">定義JSONを差し替え</button> -->
    <input type="file" id="jsonFile" accept=".json,application/json" style="display:none">
    <span id="loadState" style="font-size:.78rem; opacity:.8;"></span>
    <button class="btn primary" id="hubBtn" style="display:none" onclick="backToHub()">ハブへ戻る</button>
    <a class="btn primary" href="../index.html" target="blank">戻る</a>
    <a class="btn primary" href="./json_rd.html" target="blank">定義JSONを差し替え</a>
  </div>
</header>


<nav class="steps" id="steps"></nav>
<main id="form"></main>

<footer class="bar">
  <span class="prog" id="prog">回答 0 / 0</span>
  <span class="sp"></span>
  <button class="btn" onclick="resetAll()">クリア</button>
  <button class="btn primary" onclick="showOutput()">テキスト化</button>
</footer>

<div id="outWrap" onclick="if(event.target===this) hideOutput()">
  <div id="outCard">
    <div class="head">
      <h3>カルテ貼付テキスト(回答済み項目のみ)</h3>
      <span class="sp"></span>
      <button class="btn" onclick="hideOutput()">閉じる</button>
    </div>
    <pre id="outText"></pre>
    <div class="foot">
      <button class="btn primary" onclick="copyOutput()">コピー</button>
      <button class="btn" onclick="downloadOutput()">.txt ダウンロード</button>
      <button class="btn" onclick="downloadJson()">.json ダウンロード</button>
      <button class="btn primary" id="hubSaveBtn" style="display:none" onclick="saveToHub(true)">ハブに記録して戻る</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

const S = {};          // 回答状態: qid -> answer
let PAGES = [];        // [{no, label, groups:[{name, questions:[]}]}]
let CUR = 1;

/* ============================================================
   GET パラメータ連携(既存システムからのプリセット)— 仕様公開用
   ・patient_id / patient_name / krt_id / examiner : 文脈情報(画面と出力に記載)
   ・q.<設問名>=<値>            : 設問名の完全一致でデフォルト値を設定
   ・q.<設問名>.右= / .左=      : lr(左右)設問の側指定
   ・radio/lr選択式: 選択肢の label または value に一致で選択
   ・check: カンマ区切りで複数選択
   ・値はURLエンコード必須。プリセットは編集可能(ロックしない)
   ============================================================ */
const PARAMS = new URLSearchParams(location.search);
/* 受診ハブ（visit.html）からは karteId / alias / visit で渡ってきます。
   既存システムからの patient_id / patient_name / krt_id もそのまま受けます。 */
const META = {
  patient_id:   PARAMS.get('patient_id')   || PARAMS.get('karteId') || '',
  patient_name: PARAMS.get('patient_name') || PARAMS.get('alias')   || '',
  krt_id:       PARAMS.get('krt_id')       || '',
  examiner:     PARAMS.get('examiner')     || ''
};
const VISIT = PARAMS.get('visit') || '';   /* 受診ハブのキー。無ければ単独動作 */
function applyMeta(){
  const parts = [];
  if(META.patient_id)   parts.push('患者ID: ' + META.patient_id);
  if(META.patient_name) parts.push(META.patient_name);
  if(META.krt_id)       parts.push('受付ID: ' + META.krt_id);
  if(META.examiner)     parts.push('検査者: ' + META.examiner);
  const el = document.getElementById('metaLine');
  if(parts.length){ el.style.display='block'; el.textContent = parts.join(' ／ '); }
}
function applyPresets(){
  let n = 0;
  PARAMS.forEach((val, key)=>{
    if(!key.startsWith('q.')) return;
    let name = key.slice(2), side = null;
    if(name.endsWith('.右')){ side='右'; name = name.slice(0, -2); }
    else if(name.endsWith('.左')){ side='左'; name = name.slice(0, -2); }
    const q = DEF.questions.find(x=>x.name === name);
    if(!q) return;
    const t = q.answer_type;
    if(t==='radio' || t==='check' || (t==='lr' && (q.options||[]).length)){
      const vals = (t==='check') ? val.split(',') : [val];
      vals.forEach(v=>{
        const o = (q.options||[]).find(o=>o.label===v || o.value===v);
        if(o && !isSel(q, side||'_', o)) { toggle(q, side||'_', o, t==='check'); n++; }
      });
    } else if(t==='lr'){
      ensureLR(q); S[q.id][side||'右'].text = val; n++;
    } else if(t==='scale'){
      S[q.id] = {type:'scale', value:val}; n++;
    } else if(t==='number'){
      S[q.id] = {type:'number', value:val}; n++;
    } else {
      S[q.id] = {type:(t==='date'?'date':'text'), value:val}; n++;
    }
  });
  return n;
}

/* ---------- 定義の読み込み ---------- */
document.getElementById('jsonFile').addEventListener('change', function(ev){
  const f = ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = function(){
    try{
      const d = JSON.parse(r.result);
      if(!d.questions || !d.questions.length) throw new Error('questions がありません');
      DEF = d;
      for(const k in S) delete S[k];
      const _b=document.getElementById('sampleBanner'); if(_b) _b.style.display='none';
      document.getElementById('loadState').textContent = '読込済: ' + d.name + '(' + d.questions.length + '問)';
      build();
      toast('定義を読み込みました(' + d.questions.length + '問)');
    }catch(e){ toast('JSONの読み込みに失敗: ' + e.message); }
  };
  r.readAsText(f, 'utf-8');
});

function build(){
  document.getElementById('ttl').textContent = DEF.name || '検査カルテ';
  document.getElementById('src').textContent =
    (DEF.source || '') + ' 準拠 ／ 端末外へデータを送信・保存しません';
  const byPage = {};
  DEF.questions.slice().sort((a,b)=>(a.page_no-b.page_no)||(a.sort_order-b.sort_order)||(a.id-b.id))
    .forEach(q=>{
      (byPage[q.page_no] = byPage[q.page_no] || []).push(q);
    });
  PAGES = Object.keys(byPage).map(Number).sort((a,b)=>a-b).map(no=>{
    const qs = byPage[no];
    const groups = [];
    qs.forEach(q=>{
      const gname = q.group_name || 'その他';
      let g = groups[groups.length-1];
      if(!g || g.name !== gname){ g = {name:gname, questions:[]}; groups.push(g); }
      g.questions.push(q);
    });
    let label;
    const gnames = groups.map(g=>g.name);
    if(gnames.length===1) label = gnames[0];
    else{
      let pre = gnames[0];
      gnames.forEach(nm=>{ let i=0; while(i<pre.length && pre[i]===nm[i]) i++; pre = pre.slice(0,i); });
      pre = pre.replace(/[（(]+$/,'');
      label = (pre.length>=2) ? pre : gnames.join('・');
    }
    return {no, label: label || ('ページ'+no), groups};
  });
  if(!PAGES.find(p=>p.no===CUR)) CUR = PAGES.length ? PAGES[0].no : 1;
  const preset = applyPresets();
  renderSteps(); renderPage(); renderProg();
  if(preset) toast('連携システムから ' + preset + ' 項目をプリセットしました');
}

function renderSteps(){
  const nav = document.getElementById('steps');
  nav.innerHTML = '';
  PAGES.forEach(p=>{
    const b = document.createElement('button');
    b.innerHTML = '<span class="n">' + p.no + '</span>' + esc(p.label);
    if(p.no===CUR) b.classList.add('on');
    b.onclick = ()=>{ CUR = p.no; renderSteps(); renderPage(); window.scrollTo(0,0); };
    nav.appendChild(b);
  });
}

/* ---------- 描画 ---------- */
function renderPage(){
  const main = document.getElementById('form');
  main.innerHTML = '';
  const page = PAGES.find(p=>p.no===CUR);
  if(!page) return;
  page.groups.forEach(g=>{
    const sec = document.createElement('section'); sec.className='group';
    sec.innerHTML = '<h2>' + esc(g.name) + ' <span class="pg">P.' + page.no + '</span></h2>';
    g.questions.forEach(q=> sec.appendChild(renderQ(q)));
    main.appendChild(sec);
  });
}

function renderQ(q){
  const box = document.createElement('div');
  box.className = 'q' + (isAnswered(q) ? ' answered' : '');
  box.id = 'q' + q.id;
  const lbl = document.createElement('div'); lbl.className='label';
  lbl.innerHTML = esc(q.name)
    + (q.required ? ' <span class="req">※必須</span>' : '')
    + (isAnswered(q) ? ' <span class="done">✓ 記入済</span>' : '');
  box.appendChild(lbl);
  const t = q.answer_type;
  if(t==='radio' || t==='check')      box.appendChild(renderOpts(q, t==='check'));
  else if(t==='lr')                   box.appendChild(renderLR(q));
  else if(t==='number')               box.appendChild(renderNumber(q));
  else if(t==='scale')                box.appendChild(renderScale(q));
  else if(t==='date')                 box.appendChild(renderInput(q,'date'));
  else                                box.appendChild(renderInput(q,'text'));
  return box;
}

function renderOpts(q, multi, side){
  const wrap = document.createElement('div'); wrap.className='opts';
  const key = side ? side : '_';
  (q.options||[]).slice().sort((a,b)=>(a.sort_order-b.sort_order)||(a.id-b.id)).forEach(o=>{
    const b = document.createElement('div');
    b.className = 'opt' + (side==='右'?' sr':'') ;
    b.textContent = o.label;
    if(isSel(q,key,o)) b.classList.add('sel', side==='右'?'side-r':(side==='左'?'side-l':'x'));
    b.onclick = ()=>{ toggle(q,key,o,multi); refreshQ(q); };
    wrap.appendChild(b);
    if(o.allow_text && isSel(q,key,o)){
      const inp = document.createElement('input');
      inp.type='text'; inp.className='free'; inp.placeholder='補足を入力';
      inp.value = getFree(q,key,o);
      inp.oninput = ()=>{ setFree(q,key,o,inp.value); renderProg(); };
      inp.onclick = e=>e.stopPropagation();
      wrap.appendChild(inp);
    }
  });
  return wrap;
}

function setBoth(q,o,on){
  ensureLR(q);
  ['右','左'].forEach(sd=>{
    const s = S[q.id][sd];
    if(on){ s.sel = {}; s.sel[o.id] = o; }
    else { if(s.sel) delete s.sel[o.id]; }
  });
  const a = S[q.id];
  if(Object.keys(a['右'].sel||{}).length===0 && Object.keys(a['左'].sel||{}).length===0
     && !a['右'].text && !a['左'].text) delete S[q.id];
  renderProg();
}
function renderLR(q){
  const grid = document.createElement('div'); grid.className='lr';
  if((q.options||[]).length){
    const btag = document.createElement('div'); btag.className='side b'; btag.textContent='両';
    grid.appendChild(btag);
    const bwrap = document.createElement('div'); bwrap.className='opts';
    (q.options||[]).slice().sort((a,b)=>(a.sort_order-b.sort_order)||(a.id-b.id)).forEach(o=>{
      const bt = document.createElement('div'); bt.className='opt';
      const both = isSel(q,'右',o) && isSel(q,'左',o);
      if(both) bt.classList.add('sel');
      bt.textContent = o.label;
      bt.onclick = ()=>{ setBoth(q, o, !both); refreshQ(q); };
      bwrap.appendChild(bt);
    });
    grid.appendChild(bwrap);
  }
  [['右','r'],['左','l']].forEach(([side,cls])=>{
    const tag = document.createElement('div'); tag.className='side '+cls; tag.textContent=side;
    grid.appendChild(tag);
    if((q.options||[]).length){
      grid.appendChild(renderOpts(q, false, side));
    }else{
      const inp = document.createElement('input'); inp.type='text';
      inp.placeholder = q.placeholder || '';
      inp.value = (S[q.id] && S[q.id][side] && S[q.id][side].text) || '';
      inp.oninput = ()=>{ ensureLR(q); S[q.id][side].text = inp.value; renderProg(); markQ(q); };
      grid.appendChild(inp);
    }
  });
  return grid;
}

function renderNumber(q){
  const row = document.createElement('div'); row.className='numrow';
  const inp = document.createElement('input'); inp.type='number'; inp.inputMode='decimal';
  inp.placeholder = q.placeholder || '';
  inp.value = (S[q.id] && S[q.id].value != null) ? S[q.id].value : '';
  inp.oninput = ()=>{ S[q.id] = inp.value==='' ? undefined : {type:'number', value:inp.value}; if(inp.value==='') delete S[q.id]; renderProg(); markQ(q); };
  row.appendChild(inp);
  if(q.unit){ const u=document.createElement('span'); u.className='unit'; u.textContent=q.unit; row.appendChild(u); }
  return row;
}

function renderScale(q){
  const wrap = document.createElement('div'); wrap.className='scale';
  const min = (q.scale_min!=null)? Number(q.scale_min):0;
  const max = (q.scale_max!=null)? Number(q.scale_max):10;
  const cur = S[q.id] ? Number(S[q.id].value) : null;
  const val = document.createElement('span');
  val.className = 'val' + (cur==null?' na':'');
  val.textContent = cur==null ? '未回答' : cur;
  const rng = document.createElement('input'); rng.type='range';
  rng.min=min; rng.max=max; rng.step=1; rng.value = cur==null? Math.round((min+max)/2) : cur;
  rng.oninput = ()=>{ S[q.id]={type:'scale', value:rng.value}; val.className='val'; val.textContent=rng.value; renderProg(); markQ(q); };
  const lab = document.createElement('div');
  lab.style.cssText='display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)';
  lab.innerHTML = '<span>'+min+'</span><span>'+max+'</span>';
  wrap.appendChild(val); wrap.appendChild(rng); wrap.appendChild(lab);
  return wrap;
}

function renderInput(q, kind){
  const inp = document.createElement('input'); inp.type=kind;
  inp.placeholder = q.placeholder || '';
  inp.value = (S[q.id] && S[q.id].value) || '';
  inp.oninput = ()=>{ if(inp.value==='') delete S[q.id]; else S[q.id]={type:kind, value:inp.value}; renderProg(); markQ(q); };
  return inp;
}

/* ---------- 状態 ---------- */
function ensureLR(q){ if(!S[q.id]) S[q.id]={type:'lr','右':{}, '左':{}}; if(!S[q.id]['右'])S[q.id]['右']={}; if(!S[q.id]['左'])S[q.id]['左']={}; }
function isSel(q,key,o){
  const a=S[q.id]; if(!a) return false;
  if(a.type==='lr'){ const s=a[key]; return !!(s && s.sel && s.sel[o.id]); }
  return !!(a.sel && a.sel[o.id]);
}
function getFree(q,key,o){
  const a=S[q.id]; if(!a) return '';
  const holder = a.type==='lr' ? a[key] : a;
  return (holder && holder.free && holder.free[o.id]) || '';
}
function setFree(q,key,o,v){
  const a=S[q.id]; if(!a) return;
  const holder = a.type==='lr' ? a[key] : a;
  holder.free = holder.free || {}; holder.free[o.id]=v;
}
function toggle(q,key,o,multi){
  if(key!=='_'){ // lr
    ensureLR(q);
    const s=S[q.id][key]; s.sel=s.sel||{};
    if(s.sel[o.id]) delete s.sel[o.id];
    else { if(!multi) s.sel={}; s.sel[o.id]=o; }
    if(Object.keys(S[q.id]['右'].sel||{}).length===0 && Object.keys(S[q.id]['左'].sel||{}).length===0
       && !(S[q.id]['右'].text) && !(S[q.id]['左'].text)) delete S[q.id];
    renderProg(); return;
  }
  let a=S[q.id];
  if(!a){ a=S[q.id]={type:multi?'check':'radio', sel:{}}; }
  if(a.sel[o.id]) delete a.sel[o.id];
  else { if(!multi) a.sel={}; a.sel[o.id]=o; }
  if(Object.keys(a.sel).length===0) delete S[q.id];
  renderProg();
}
function isAnswered(q){ return S[q.id] !== undefined; }
function markQ(q){
  const el=document.getElementById('q'+q.id); if(!el) return;
  el.className='q'+(isAnswered(q)?' answered':'');
  const d=el.querySelector('.done');
  if(isAnswered(q) && !d) el.querySelector('.label').insertAdjacentHTML('beforeend',' <span class="done">✓ 記入済</span>');
  if(!isAnswered(q) && d) d.remove();
}
function refreshQ(q){
  const old=document.getElementById('q'+q.id);
  if(old) old.replaceWith(renderQ(q));
}
function renderProg(){
  const total = DEF.questions.length;
  const done  = DEF.questions.filter(isAnswered).length;
  document.getElementById('prog').textContent = '回答 ' + done + ' / ' + total;
}
function resetAll(){
  if(!confirm('入力内容をすべてクリアします。よろしいですか?')) return;
  for(const k in S) delete S[k];
  renderPage(); renderProg();
}

/* ---------- 出力: 回答済み項目のみテキスト化 ---------- */
function answerText(q){
  const a = S[q.id]; if(!a) return null;
  const optJoin = holder=>{
    if(!holder || !holder.sel) return '';
    return Object.values(holder.sel)
      .map(o=>'['+o.label+']' + ((holder.free && holder.free[o.id]) ? holder.free[o.id] : ''))
      .join(' ');
  };
  switch(a.type){
    case 'radio': case 'check': return optJoin(a);
    case 'number': return a.value + (q.unit ? ' ' + q.unit : '');
    case 'scale':  return a.value + (q.unit ? ' ' + q.unit : '')
                      + '(' + ((q.scale_min!=null)?q.scale_min:0) + '〜' + ((q.scale_max!=null)?q.scale_max:10) + ')';
    case 'lr': {
      const parts=[];
      ['右','左'].forEach(sd=>{
        const s=a[sd]; if(!s) return;
        const t = (s.sel && Object.keys(s.sel).length) ? optJoin(s) : (s.text||'');
        if(t) parts.push('(' + sd + ')' + t);
      });
      return parts.join(' ');
    }
    default: return a.value;
  }
}
function buildText(){
  const now = new Date();
  const z = n=>String(n).padStart(2,'0');
  const stamp = now.getFullYear()+'-'+z(now.getMonth()+1)+'-'+z(now.getDate())+' '+z(now.getHours())+':'+z(now.getMinutes());
  let out = '■ ' + (DEF.name||'') + '\n記録日時: ' + stamp + '\n';
  if(META.patient_id || META.patient_name || META.krt_id){
    out += '患者: ' + [META.patient_id, META.patient_name].filter(Boolean).join(' ')
         + (META.krt_id ? '  受付ID: ' + META.krt_id : '') + '\n';
  }
  if(META.examiner) out += '検査者: ' + META.examiner + '\n';
  let lastGroup = null, wrote = 0;
  DEF.questions.slice().sort((a,b)=>(a.page_no-b.page_no)||(a.sort_order-b.sort_order)||(a.id-b.id))
    .forEach(q=>{
      const t = answerText(q);
      if(t==null || t==='') return;
      const g = q.group_name || 'その他';
      if(g !== lastGroup){ out += '【' + g + '】\n'; lastGroup = g; }
      out += '・' + q.name + ': ' + t + '\n';
      wrote++;
    });
  if(!wrote) out += '(回答済みの項目はありません)\n';
  out += '――――\n' + (DEF.source||'') + ' 準拠(' + wrote + '項目記入)\n';
  return out;
}
function showOutput(){
  document.getElementById('outText').textContent = buildText();
  document.getElementById('outWrap').style.display = 'block';
}
function hideOutput(){ document.getElementById('outWrap').style.display = 'none'; }
function copyOutput(){
  const t = document.getElementById('outText').textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('コピーしました — カルテに貼り付けてください'),
      ()=>fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('コピーしました'); }catch(e){ toast('コピーに失敗しました'); }
  ta.remove();
}
function downloadOutput(){
  const blob = new Blob([document.getElementById('outText').textContent], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ortho_exam_' + new Date().toISOString().slice(0,10) + '.txt';
  a.click(); URL.revokeObjectURL(a.href);
}
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================================================
   受診ハブ（visit.html）との連携
   ・?visit=キー を付けて開かれたときだけ働きます。
   ・同じドメインの端末内ストレージ（vetss / visits）を共有します。
   ・単独で使うときは何も起きません。通信はしません。
   ============================================================ */
const HUB = { h:null, ok:false };
function hubOpen(){
  return new Promise(res=>{
    if(!VISIT) return res(null);
    let q; try{ q = indexedDB.open("vetss",1); }catch(e){ return res(null); }
    q.onupgradeneeded = e=>{ const d=e.target.result;
      if(!d.objectStoreNames.contains("visits")) d.createObjectStore("visits",{keyPath:"key"}); };
    q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); q.onblocked=()=>res(null);
    setTimeout(()=>res(null),3000);
  });
}
const pad2 = n => String(n).padStart(2,'0');
function isoLocal(d){
  const o=-d.getTimezoneOffset(), s=o>=0?'+':'-', a=Math.abs(o);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+
    pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds())+
    s+pad2(Math.floor(a/60))+':'+pad2(a%60);
}

/* 回答を機械可読な形にまとめます（テキストは従来どおり別に作ります） */
function buildJson(){
  const list = [];
  DEF.questions.slice()
    .sort((a,b)=>(a.page_no-b.page_no)||(a.sort_order-b.sort_order)||(a.id-b.id))
    .forEach(q=>{
      const t = answerText(q);
      if(t==null || t==='') return;
      list.push({ id:q.id, group:q.group_name||'', name:q.name,
                  type:q.answer_type, text:t });
    });
  return {
    schema: 'vetss-enquete/0.1',
    form:   DEF.name || '',
    source: DEF.source || '',
    recordedAt: isoLocal(new Date()),
    patient: { karteId: META.patient_id, alias: META.patient_name, resolved:false },
    examiner: META.examiner,
    answers: list,
    text: buildText()
  };
}
function downloadJson(){
  const o = buildJson();
  const blob = new Blob([JSON.stringify(o,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ortho_exam_' + (o.patient.karteId ? o.patient.karteId + '_' : '') +
               o.recordedAt.slice(0,10).replace(/-/g,'') + '.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('保存しました');
}

/* ハブの受診レコードへ書き戻します。無ければその場で作ります。 */
function saveToHub(thenBack){
  if(!HUB.ok){ toast('ハブに記録できませんでした'); return; }
  const rec = buildJson();
  if(!rec.answers.length){ toast('まだ回答がありません'); return; }
  let done = false;
  const fin = ok => {
    if(done) return; done = true;
    if(ok){ toast('ハブに記録しました'); if(thenBack) setTimeout(backToHub, 700); }
    else toast('ハブに記録できませんでした');
  };
  setTimeout(()=>fin(false), 2500);
  try{
    const st = HUB.h.transaction('visits','readwrite').objectStore('visits');
    const g = st.get(VISIT);
    g.onsuccess = ()=>{
      let v = g.result;
      if(!v){
        const m = String(VISIT).match(/_(\d{4}-\d{2}-\d{2})$/);
        const d = new Date();
        v = { key:VISIT, karteId:META.patient_id, alias:META.patient_name,
              date: m ? m[1] : d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()),
              enquete:null, karte:null, receipt:null };
      }
      v.enquete = rec;
      v.updatedAt = isoLocal(new Date());
      const w = st.put(v);
      w.onsuccess = ()=>fin(true);
      w.onerror   = ()=>fin(false);
    };
    g.onerror = ()=>fin(false);
  }catch(e){ fin(false); }
}
function backToHub(){
  location.href = '../visit/visit.html?visit=' + encodeURIComponent(VISIT);
}

/* 打ち終えた内容が消えないよう、回答のたびにハブへ控えます */
let hubT;
function hubAuto(){
  if(!HUB.ok) return;
  clearTimeout(hubT);
  hubT = setTimeout(()=>saveToHub(false), 1200);
}

build();

/* 起動時にハブへ接続（?visit= があるときだけ） */
if(VISIT){
  hubOpen().then(h=>{
    HUB.h = h; HUB.ok = !!h;
    if(HUB.ok){
      document.getElementById('hubBtn').style.display = '';
      document.getElementById('hubSaveBtn').style.display = '';
      /* 回答が変わったら自動で控えます */
      document.addEventListener('change', hubAuto, true);
      document.addEventListener('click', e=>{
        if(e.target && e.target.closest && e.target.closest('main')) hubAuto();
      }, true);
    }
  });
}
applyMeta();
document.getElementById('loadState').textContent = '内蔵定義: ' + DEF.questions.length + '問';

/* ---------- ?def=<URL> : サイト設置型の外部定義読込(v0.4) ----------
   例: /forms/?def=/forms/defs/urine.json
   同一オリジン(またはCORS許可済み)のJSONを取得して定義を差し替える。
   失敗時は内蔵定義のまま動作を続ける(壊れない)。file://では使えません */
(function(){
  const defUrl = PARAMS.get('def');
  if(!defUrl) return;
  document.getElementById('loadState').textContent = '外部定義を読込中…';
  fetch(defUrl, {cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d=>{
      if(!d.questions || !d.questions.length) throw new Error('questions がありません');
      DEF = d;
      for(const k in S) delete S[k];
      build();
      document.getElementById('loadState').textContent = '外部定義: ' + d.name + '(' + d.questions.length + '問)';
      toast('定義を読み込みました: ' + d.name);
    })
    .catch(e=>{
      document.getElementById('loadState').textContent = '内蔵定義: ' + DEF.questions.length + '問(外部定義の読込失敗)';
      toast('外部定義の読込に失敗: ' + e.message);
    });
})();
</script>
